<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SandTech | Messagerie Live</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card" id="auth-box">
    <h2>SandTech Connect</h2>
    <input type="text" id="pseudo" placeholder="Pseudo choisi">
    <input type="text" id="nom" placeholder="Nom complet">
    <input type="email" id="email" placeholder="Adresse email">
    <button onclick="register()">Créer mon compte SandTech</button>
</div>

<div class="card" id="chat-area" style="display:none;">
    <h2>Salon SandTech</h2>
    <div id="messages"></div>
    <div class="input-group">
        <input type="text" id="msg-input" placeholder="Ton message...">
        <button onclick="sendMessage()">Envoyer</button>
    </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
