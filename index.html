<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard YT Admin</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #1a1a1a; color: white; }
        .box { background: #333; padding: 20px; border-radius: 8px; }
        input { display: block; margin: 10px 0; padding: 10px; width: 200px; }
    </style>
</head>
<body>

<div class="box" id="login-box">
    <h2>Connexion YT</h2>
    <input type="password" id="pass" placeholder="Entrez le mot de passe">
    <button onclick="checkLogin()">Accéder</button>
</div>

<div id="dashboard" style="display:none;">
    <h1>Bienvenue sur ton Dashboard</h1>
    <div id="content"></div>
</div>

<script>
function checkLogin() {
    const p = document.getElementById('pass').value;
    const dash = document.getElementById('dashboard');
    const content = document.getElementById('content');

    if (p === 'ayman') {
        document.getElementById('login-box').style.display = 'none';
        dash.style.display = 'block';
        content.innerHTML = "<h3>Panneau Administrateur</h3><p>Accès aux statistiques complètes et paramètres de chaîne.</p>";
    } else if (p === 'aygame') {
        document.getElementById('login-box').style.display = 'none';
        dash.style.display = 'block';
        content.innerHTML = "<h3>Panneau Utilisateur</h3><p>Accès au planning de vidéos et idées de contenu.</p>";
    } else {
        alert("Mot de passe incorrect !");
    }
}
</script>
</body>
</html>
