<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SandTech - Messagerie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box" id="auth-box">
    <h2>Bienvenue sur SandTech</h2>
    <form id="user-form">
        <input type="text" id="pseudo" placeholder="Choisir un pseudo" required>
        <input type="text" id="nom" placeholder="Nom" required>
        <input type="text" id="prenom" placeholder="Prénom" required>
        <input type="number" id="age" placeholder="Âge" required>
        <input type="email" id="email" placeholder="Adresse mail" required>
        <button type="submit">Rejoindre le salon</button>
    </form>
</div>

<div id="chat-box" style="display:none;">
    <div id="messages"></div>
    <input type="text" id="msg-input" placeholder="Message...">
    <button onclick="sendMessage()">Envoyer</button>
</div>

<script src="script.js"></script>
</body>
</html>
