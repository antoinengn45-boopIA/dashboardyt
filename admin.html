<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Calendrier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calendar-container">
    <h1>Dashboard Admin</h1>
    <div class="calendar-grid" id="admin-calendar">
        <div class="day-header">Lun</div><div class="day-header">Mar</div>
        <div class="day-header">Mer</div><div class="day-header">Jeu</div>
        <div class="day-header">Ven</div><div class="day-header">Sam</div>
        <div class="day-header">Dim</div>
        <div class="day">1</div><div class="day">2</div><div class="day">3</div><div class="day">4</div>
        <div class="day">5</div><div class="day">6</div><div class="day">7</div>
    </div>
</div>

<script>
    const auth = prompt("Mot de passe Admin :");
    if (auth !== "ayman") {
        document.body.innerHTML = "<h1>Accès refusé.</h1>";
        setTimeout(() => { window.location.href = "index.html"; }, 2000);
    }
</script>
</body>
</html>
