<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SandTech Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calendar-container">
    <h1>SandTech Admin Dashboard</h1>
    <div class="calendar-grid">
        <div class="day-header">Lun</div><div class="day-header">Mar</div>
        <div class="day-header">Mer</div><div class="day-header">Jeu</div>
        <div class="day-header">Ven</div><div class="day-header">Sam</div>
        <div class="day-header">Dim</div>
        <!-- Les cases deviennent éditables pour SandTech -->
        <div class="day" contenteditable="true" data-id="1">1</div>
        <div class="day" contenteditable="true" data-id="2">2</div>
        <div class="day" contenteditable="true" data-id="3">3</div>
    </div>
</div>

<script>
    const auth = prompt("Mot de passe SandTech Admin :");
    if (auth !== "ayman") {
        document.body.innerHTML = "<h1>Accès refusé.</h1>";
        setTimeout(() => { window.location.href = "index.html"; }, 2000);
    }
</script>
</body>
</html>
