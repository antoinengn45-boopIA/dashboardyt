<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SandTech | Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <button onclick="window.location.href='index.html'" style="background: #334155; color: white; margin-bottom: 20px; cursor: pointer; border: none; padding: 10px; border-radius: 4px;">Retour au Salon</button>
        <h1>Dashboard Admin</h1>
        <div id="user-list"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyApHM6M8CMhKaad5E4lQfWzjxJziMzWkBs",
            authDomain: "web-app-5c43b.firebaseapp.com",
            projectId: "web-app-5c43b",
            storageBucket: "web-app-5c43b.appspot.com",
            messagingSenderId: "821414265483",
            appId: "1:821414265483:web:bc04011134684930194a8e",
            databaseURL: "https://web-app-5c43b-default-rtdb.firebaseio.com"
        };

        const db = getDatabase(initializeApp(firebaseConfig));

        if (prompt("Mot de passe Admin :") === "ayman") {
            onValue(ref(db, 'users'), (snapshot) => {
                const data = snapshot.val();
                const list = document.getElementById('user-list');
                list.innerHTML = data ? Object.values(data).map(u => `<p><b>${u.pseudo}</b> (${u.email})</p>`).join('') : "Aucun utilisateur.";
            });
        } else {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
