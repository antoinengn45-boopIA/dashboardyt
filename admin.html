<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>YT Admin - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box">
    <h2>Panneau Administrateur</h2>
    <p>Cette page est sécurisée.</p>
    
    <div id="admin-content" style="display:none;">
        <h3>Dernières notifications :</h3>
        <p>Pour voir les données des utilisateurs, veuillez consulter votre boîte mail liée à <strong>Formspree (xaqkvjqb)</strong>. Chaque soumission de formulaire vous y est envoyée automatiquement.</p>
    </div>
</div>

<script>
    // Protection simple par mot de passe pour la page Admin
    const auth = prompt("Entrez le mot de passe Admin :", "");
    if (auth === "ayman") {
        document.getElementById('admin-content').style.display = 'block';
    } else {
        document.body.innerHTML = "<h1>Accès refusé. Retournez à l'accueil.</h1>";
        setTimeout(() => { window.location.href = "index.html"; }, 2000);
    }
</script>

</body>
</html>
